

services:

  contractiq-db:
    image: pgvector/pgvector:pg17
    container_name: contractiq-db
    environment:
      POSTGRES_DB: contractiq_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - contractiq_data:/var/lib/postgresql/data
    restart: unless-stopped

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: contractiq-embedding
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: gemini-embedding-001
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50
      EMBEDDING_DIMS: 768
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  contractiq_data: {}